[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcheck"
version = "0.1.0"
description = "Lint agent skill folders (SKILL.md): frontmatter, broken references, vague descriptions, duplicates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
skillcheck = "skillcheck.cli:main"

[tool.setuptools]
packages = ["skillcheck"]
